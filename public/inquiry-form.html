<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Inquiry form registration</title></head>
  <body>
    <form name="inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="inquiry" />
      <input type="hidden" name="subject" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="community" />
      <select name="role"><option>Other</option></select>
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
